<section
  id="client-directory"
  class="relative w-full overflow-hidden bg-linear-to-b from-white via-[#f7faf7] to-white py-16 sm:py-20 lg:py-28"
  aria-labelledby="client-directory-heading"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-10">
    <!-- Header Section -->
    <div class="flex flex-col items-center text-center">
      <!-- Two-Tone H2 -->
      <h2
        id="client-directory-heading"
        class="text-2xl font-bold tracking-tight text-[#191c1b] leading-tight sm:text-3xl md:text-4xl lg:text-[44px]"
      >
        <span>{{ 'OUR_CUSTOMERS.LOGO_GRID.TITLE_PREFIX' | translate }}</span>
        <span class="text-[#066b5b]">{{
          'OUR_CUSTOMERS.LOGO_GRID.TITLE_HIGHLIGHT' | translate
        }}</span>
        <span>{{ 'OUR_CUSTOMERS.LOGO_GRID.TITLE_SUFFIX' | translate }}</span>
      </h2>

      <!-- Subtitle -->
      <p class="mt-4 max-w-2xl text-base font-normal leading-relaxed text-slate-600 sm:text-lg">
        {{ 'OUR_CUSTOMERS.LOGO_GRID.SUBTITLE' | translate }}
      </p>
    </div>

    <!-- Framed Logo Grid -->
    <div class="mt-12 sm:mt-16">
      <div
        class="grid grid-cols-2 gap-4 sm:grid-cols-3 sm:gap-6 md:grid-cols-4 lg:grid-cols-6"
        role="list"
        aria-label="Client company logos"
      >
        @for (logo of allLogos; track logo.id) {
          <div
            class="group relative flex h-28 sm:h-32 items-center justify-center rounded-2xl border border-slate-200/80 bg-white p-5 sm:p-6 shadow-xs transition-all duration-300 hover:-translate-y-1 hover:border-[#066b5b]/40 hover:shadow-md select-none cursor-default"
            role="listitem"
            [attr.aria-label]="logo.name || logo.alt"
          >
            <img
              [ngSrc]="logo.src"
              [alt]="logo.alt"
              [width]="logo.width"
              [height]="logo.height"
              draggable="false"
              (dragstart)="$event.preventDefault()"
              class="max-h-12 sm:max-h-14 max-w-[82%] w-auto h-auto object-contain grayscale-0 opacity-100 md:grayscale md:opacity-75 transition-all duration-300 group-hover:scale-105 group-hover:grayscale-0 group-hover:opacity-100 select-none [user-drag:none] [-webkit-user-drag:none]"
            />
          </div>
        }
      </div>
    </div>
  </div>
</section>
